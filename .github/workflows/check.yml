name: Check and build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: planner
            archive: planner-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: planner.exe
            archive: planner-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: planner
            archive: planner-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build -p planner --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: planner-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Package Linux and macOS release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p planner --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install --locked trunk
      - run: trunk build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: planner-web
          path: dist/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
          fi
