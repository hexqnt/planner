[package]
name = "planner"
version = "0.1.1"
edition = "2024"
authors = ["hexqnt <hexqntlab@gmail.com>"]
license = "Apache-2.0 OR MIT"
description = "A minimal year planner for desktop and web"
repository = "https://github.com/hexqnt/planner"
readme = "README.md"
keywords = ["calendar", "planner", "timeline", "heatmap"]
categories = ["gui", "date-and-time"]
publish = false

[workspace]
members = ["xtask", "tools/test-support", "tools/profiling", "tools/tests"]
default-members = [".", "tools/tests", "tools/profiling"]
resolver = "3"

[workspace.dependencies]
planner = { path = "." }
planner-test-support = { path = "tools/test-support" }
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui_kittest = "0.36.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
testing = []

[dependencies]
eframe = { workspace = true, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui.workspace = true
egui_extras = { version = "0.36.2", default-features = false, features = [
    "svg",
] }
holidays-ru = { version = "0.2.2", features = ["chrono"] }
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
url = { version = "2", features = ["serde"] }
rustc-hash = "2.1.3"
icalendar = "0.17.14"
chrono-tz = { version = "0.10", features = ["serde"] }
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4", "js"] }
nucleo-matcher = "0.3.1"
unicode-segmentation = "1.12"
web-time = "1.1"
sys-locale = { version = "0.3", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-file-dialog = "0.15.0"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Navigator",
    "Blob",
    "BlobPropertyBag",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Url",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "console",
] }

[build-dependencies]
serde.workspace = true
toml = { version = "1.1", default-features = false, features = [
    "parse",
    "serde",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Дубли транзитивных зависимостей определяются графическим стеком eframe.
multiple_crate_versions = "allow"
